version: '3.8'

services:
  postgres_db:
    image: postgres:13
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  flask_web:
    build: .
    depends_on:
      - postgres_db
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres_db:5432/mydb
    ports:
      - "5000:5000"

  flask_nginx:
    image: nginx:alpine
    depends_on:
      - flask_web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  db_data: