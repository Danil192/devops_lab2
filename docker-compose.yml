services:
  postgres_db:
    image: postgres:13
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 2s
      timeout: 5s
      retries: 15

  flask_web:
    build: .
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres_db:5432/mydb
    restart: on-failure
    # Уберите публикацию порта 5000 — всё идёт через NGINX!
    # ports:
    #   - "5000:5000"

  flask_nginx:
    image: nginx:alpine
    depends_on:
      - flask_web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data: